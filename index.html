<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記帳儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f11;--surface:#1a1a1f;--surface2:#222228;--border:#2e2e38;
    --text:#f0f0f5;--muted:#7a7a8a;--accent:#7c6af7;--danger:#ff6b6b;
    --warn:#ffd93d;--success:#6bcb77;--twd:#4ecdc4;--income:#27AE60;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}
  #setup-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
  .setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:480px;}
  .setup-card h1{font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;}
  .setup-card>p{color:var(--muted);font-size:0.9rem;margin-bottom:2rem;line-height:1.6;}
  .form-group{margin-bottom:1.25rem;}
  .form-group label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem;letter-spacing:0.05em;text-transform:uppercase;}
  .form-group input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.75rem 1rem;color:var(--text);font-family:'DM Mono',monospace;font-size:0.85rem;outline:none;transition:border-color 0.2s;}
  .form-group input:focus{border-color:var(--accent);}
  .btn-primary{width:100%;background:var(--accent);color:white;border:none;border-radius:8px;padding:0.85rem;font-size:0.95rem;font-weight:500;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
  #dashboard{display:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;gap:1rem;flex-wrap:wrap;}
  .topbar h1{font-size:1.1rem;font-weight:700;}
  .topbar-right{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;}
  .rate-badge{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.9rem;font-size:0.78rem;color:var(--twd);font-family:'DM Mono',monospace;display:flex;align-items:center;gap:0.4rem;}
  .rate-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .currency-toggle{display:flex;align-items:center;gap:0.25rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.3rem;}
  .curr-btn{background:none;border:none;border-radius:6px;padding:0.3rem 0.65rem;color:var(--muted);font-size:0.78rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all 0.2s;}
  .curr-btn.active{background:var(--accent);color:white;}
  .month-nav{display:flex;align-items:center;gap:0.5rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.75rem;}
  .month-nav button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 0.25rem;}
  #month-label{font-family:'DM Mono',monospace;font-size:0.85rem;min-width:80px;text-align:center;}
  .btn-export,.btn-logout{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.9rem;color:var(--text);font-size:0.82rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
  .btn-logout{color:var(--muted);}
  .main{padding:2rem;max-width:1200px;margin:0 auto;}

  /* Stats */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;}
  .stat-card.income-card{border-color:rgba(39,174,96,0.3);background:rgba(39,174,96,0.05);}
  .stat-card.balance-card{border-color:rgba(124,106,247,0.3);}
  .stat-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.5rem;}
  .stat-value{font-family:'DM Mono',monospace;font-size:1.6rem;font-weight:500;line-height:1;}
  .stat-sub{font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--twd);margin-top:0.35rem;}
  .stat-value.accent{color:var(--accent);}
  .stat-value.warn{color:var(--warn);}
  .stat-value.income{color:var(--income);}
  .stat-value.danger{color:var(--danger);}

  /* Budget Section */
  .budget-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:2rem;}
  .budget-card h2{font-size:0.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1.25rem;}
  .budget-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;}
  .budget-item{background:var(--surface2);border-radius:10px;padding:1rem 1.25rem;}
  .budget-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem;}
  .budget-cat{font-size:0.9rem;font-weight:500;display:flex;align-items:center;gap:0.4rem;}
  .budget-pct{font-family:'DM Mono',monospace;font-size:0.85rem;font-weight:500;}
  .budget-bar-wrap{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:0.5rem;}
  .budget-bar{height:100%;border-radius:4px;transition:width 0.6s ease;}
  .budget-bar.ok{background:var(--success);}
  .budget-bar.warn{background:var(--warn);}
  .budget-bar.over{background:var(--danger);}
  .budget-amounts{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted);}
  .budget-amounts .used{color:var(--text);}
  .budget-amounts .total{color:var(--muted);}
  .budget-status{font-size:0.72rem;margin-top:0.3rem;}
  .budget-status.ok{color:var(--success);}
  .budget-status.warn{color:var(--warn);}
  .budget-status.over{color:var(--danger);}
  .no-budget{color:var(--muted);font-size:0.85rem;padding:1rem 0;}

  /* Charts */
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;}
  @media(max-width:768px){.chart-grid{grid-template-columns:1fr}.topbar{padding:1rem}.main{padding:1rem}}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;}
  .chart-card h2{font-size:0.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1.25rem;}
  .chart-wrap{position:relative;height:240px;}

  /* Members */
  .member-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:2rem;}
  .member-card h2{font-size:0.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:1.25rem;}
  .member-row{display:flex;align-items:center;gap:1rem;padding:0.75rem 0;border-bottom:1px solid var(--border);}
  .member-row:last-child{border-bottom:none;}
  .member-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;color:var(--accent);flex-shrink:0;}
  .member-name{flex:1;font-size:0.9rem;}
  .member-bar-wrap{flex:2;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
  .member-bar{height:100%;background:var(--accent);border-radius:3px;}
  .member-amount{font-family:'DM Mono',monospace;font-size:0.85rem;min-width:110px;text-align:right;}
  .member-sub{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--twd);min-width:90px;text-align:right;}

  /* Records */
  .records-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:2rem;}
  .records-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:1rem;flex-wrap:wrap;}
  .records-header h2{font-size:0.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  .filter-row{display:flex;gap:0.5rem;flex-wrap:wrap;}
  .filter-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.75rem;color:var(--muted);font-size:0.78rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
  .filter-btn.active{background:var(--accent);border-color:var(--accent);color:white;}
  .filter-btn.income-btn.active{background:var(--income);border-color:var(--income);}
  table{width:100%;border-collapse:collapse;font-size:0.87rem;}
  th{text-align:left;padding:0.5rem 0.75rem;color:var(--muted);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;font-weight:400;border-bottom:1px solid var(--border);}
  td{padding:0.75rem;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface2);}
  tr.income-row td{background:rgba(39,174,96,0.03);}
  .cat-badge{display:inline-block;padding:0.2rem 0.6rem;border-radius:4px;font-size:0.72rem;font-weight:500;}
  .amount-main{font-family:'DM Mono',monospace;font-weight:500;}
  .amount-main.expense{color:var(--danger);}
  .amount-main.income{color:var(--income);}
  .amount-sub{font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--twd);}
  .curr-badge{display:inline-block;padding:0.1rem 0.4rem;border-radius:3px;font-size:0.68rem;font-family:'DM Mono',monospace;margin-left:0.3rem;}
  .curr-badge.jpy{background:rgba(255,107,107,0.15);color:#ff9999;}
  .curr-badge.twd{background:rgba(78,205,196,0.15);color:var(--twd);}
  .date-cell{font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--muted);}
  .type-badge{display:inline-block;padding:0.15rem 0.5rem;border-radius:4px;font-size:0.7rem;}
  .type-badge.expense{background:rgba(255,107,107,0.15);color:var(--danger);}
  .type-badge.income{background:rgba(39,174,96,0.15);color:var(--income);}
  .loading{text-align:center;padding:3rem;color:var(--muted);font-size:0.9rem;}
  .spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:2rem;color:var(--muted);font-size:0.9rem;}
</style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-card">
    <h1>📒 記帳儀表板</h1>
    <p>輸入你的 Supabase 連線資訊來開始使用。資訊只會儲存在你的瀏覽器中。</p>
    <div class="form-group"><label>Supabase URL</label><input type="text" id="input-url" placeholder="https://xxxxxxxx.supabase.co"></div>
    <div class="form-group"><label>Supabase Anon Key</label><input type="text" id="input-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></div>
    <div class="form-group"><label>LINE 群組 ID（選填）</label><input type="text" id="input-group" placeholder="C1234567890abcdef..."></div>
    <button class="btn-primary" onclick="connect()">連線</button>
    <p id="setup-error" style="color:var(--danger);font-size:0.8rem;margin-top:0.75rem;display:none;"></p>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <h1>📒 記帳儀表板</h1>
    <div class="topbar-right">
      <div class="rate-badge"><span class="rate-dot"></span><span id="rate-display">匯率載入中...</span></div>
      <div class="currency-toggle">
        <button class="curr-btn active" id="btn-all" onclick="setDisplayCurrency('ALL')">全部</button>
        <button class="curr-btn" id="btn-jpy" onclick="setDisplayCurrency('JPY')">🇯🇵 JPY</button>
        <button class="curr-btn" id="btn-twd" onclick="setDisplayCurrency('TWD')">🇹🇼 TWD</button>
      </div>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <span id="month-label"></span>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <button class="btn-export" onclick="exportCSV()">匯出 CSV</button>
      <button class="btn-logout" onclick="logout()">登出</button>
    </div>
  </div>

  <div class="main">
    <div id="loading" class="loading"><div class="spinner"></div>載入資料中...</div>
    <div id="content" style="display:none">

      <!-- Stats -->
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">本月支出</div><div class="stat-value danger" id="stat-expense">—</div><div class="stat-sub" id="stat-expense-sub"></div></div>
        <div class="stat-card income-card"><div class="stat-label">本月收入</div><div class="stat-value income" id="stat-income">—</div><div class="stat-sub" id="stat-income-sub"></div></div>
        <div class="stat-card balance-card"><div class="stat-label">結餘</div><div class="stat-value accent" id="stat-balance">—</div><div class="stat-sub" id="stat-balance-sub"></div></div>
        <div class="stat-card"><div class="stat-label">記帳筆數</div><div class="stat-value" id="stat-count">—</div></div>
        <div class="stat-card"><div class="stat-label">平均每筆支出</div><div class="stat-value warn" id="stat-avg">—</div><div class="stat-sub" id="stat-avg-sub"></div></div>
      </div>

      <!-- Budget -->
      <div class="budget-card">
        <h2>🎯 本月預算進度</h2>
        <div id="budget-content"><div class="no-budget">載入中...</div></div>
      </div>

      <!-- Charts -->
      <div class="chart-grid">
        <div class="chart-card"><h2>支出類別佔比</h2><div class="chart-wrap"><canvas id="chart-pie"></canvas></div></div>
        <div class="chart-card"><h2>每日收支趨勢</h2><div class="chart-wrap"><canvas id="chart-line"></canvas></div></div>
      </div>

      <!-- Members -->
      <div class="member-card"><h2>成員支出統計</h2><div id="member-list"></div></div>

      <!-- Records -->
      <div class="records-card">
        <div class="records-header">
          <h2>明細紀錄</h2>
          <div class="filter-row">
            <button class="filter-btn active" onclick="filterCategory('全部')">全部</button>
            <button class="filter-btn income-btn" onclick="filterCategory('收入')">💰 收入</button>
            <button class="filter-btn" onclick="filterCategory('餐飲')">🍜 餐飲</button>
            <button class="filter-btn" onclick="filterCategory('交通')">🚌 交通</button>
            <button class="filter-btn" onclick="filterCategory('住宿')">🏨 住宿</button>
            <button class="filter-btn" onclick="filterCategory('購物')">🛒 購物</button>
            <button class="filter-btn" onclick="filterCategory('娛樂')">🎬 娛樂</button>
            <button class="filter-btn" onclick="filterCategory('日用品')">🧴 日用品</button>
            <button class="filter-btn" onclick="filterCategory('其他')">📦 其他</button>
          </div>
        </div>
        <div id="records-table"></div>
      </div>
    </div>
  </div>
</div>

<script>
let SUPABASE_URL='',SUPABASE_KEY='',GROUP_ID='';
let currentYear=new Date().getFullYear(),currentMonth=new Date().getMonth()+1;
let allRecords=[],budgetData=[],activeFilter='全部',charts={};
let jpyRate=0.21;
let displayCurrency='ALL';

const CAT_COLORS={'餐飲':'#ff6b6b','交通':'#4ecdc4','住宿':'#ffd93d','購物':'#7c6af7','娛樂':'#ff9f43','日用品':'#5dade2','收入':'#27AE60','其他':'#a0a0b0'};
const CAT_EMOJI={'餐飲':'🍜','交通':'🚌','住宿':'🏨','購物':'🛒','娛樂':'🎬','日用品':'🧴','收入':'💰','其他':'📦'};

async function fetchRate(){
  try{
    const res=await fetch('https://api.exchangerate-api.com/v4/latest/JPY');
    const data=await res.json();
    jpyRate=data.rates['TWD']||0.21;
    document.getElementById('rate-display').textContent=`1 JPY = ${jpyRate.toFixed(4)} TWD`;
  }catch{document.getElementById('rate-display').textContent='匯率暫無法取得';}
}

function toTWD(amount,currency){
  if(currency==='TWD')return Number(amount);
  return Number(amount)*jpyRate;
}

function toJPY(amount,currency){
  if(currency==='JPY')return Number(amount);
  return Number(amount)/jpyRate;
}

function fmtMain(amount,currency){
  const sym=currency==='TWD'?'NT$':'¥';
  return `${sym}${Number(amount).toLocaleString()}`;
}

function fmtSub(amount,currency){
  if(currency==='TWD')return `≈ ¥${Math.round(Number(amount)/jpyRate).toLocaleString()}`;
  return `≈ NT$${Math.round(Number(amount)*jpyRate).toLocaleString()}`;
}

function setDisplayCurrency(curr){
  displayCurrency=curr;
  ['all','jpy','twd'].forEach(c=>{
    document.getElementById(`btn-${c}`).classList.toggle('active',c===curr.toLowerCase());
  });
  renderAll();
}

function filterByCurrency(records){
  if(displayCurrency==='ALL')return records;
  return records.filter(r=>(r.currency||'JPY')===displayCurrency);
}

function connect(){
  const url=document.getElementById('input-url').value.trim();
  const key=document.getElementById('input-key').value.trim();
  const group=document.getElementById('input-group').value.trim();
  if(!url||!key){const e=document.getElementById('setup-error');e.textContent='請填入 Supabase URL 和 Anon Key';e.style.display='block';return;}
  SUPABASE_URL=url.replace(/\/$/,'');SUPABASE_KEY=key;GROUP_ID=group;
  localStorage.setItem('sb_url',SUPABASE_URL);localStorage.setItem('sb_key',SUPABASE_KEY);localStorage.setItem('sb_group',GROUP_ID);
  showDashboard();
}

function logout(){localStorage.removeItem('sb_url');localStorage.removeItem('sb_key');localStorage.removeItem('sb_group');location.reload();}

window.addEventListener('load',()=>{
  const url=localStorage.getItem('sb_url'),key=localStorage.getItem('sb_key');
  if(url&&key){
    document.getElementById('input-url').value=url;document.getElementById('input-key').value=key;
    document.getElementById('input-group').value=localStorage.getItem('sb_group')||'';
    SUPABASE_URL=url;SUPABASE_KEY=key;GROUP_ID=localStorage.getItem('sb_group')||'';
    showDashboard();
  }
});

function showDashboard(){
  document.getElementById('setup-screen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  updateMonthLabel();fetchRate().then(()=>loadData());
}

function updateMonthLabel(){document.getElementById('month-label').textContent=`${currentYear}/${String(currentMonth).padStart(2,'0')}`;}

function changeMonth(delta){
  currentMonth+=delta;
  if(currentMonth>12){currentMonth=1;currentYear++;}
  if(currentMonth<1){currentMonth=12;currentYear--;}
  updateMonthLabel();loadData();
}

async function loadData(){
  document.getElementById('loading').style.display='block';
  document.getElementById('content').style.display='none';

  const startDate=`${currentYear}-${String(currentMonth).padStart(2,'0')}-01`;
  const endDate=currentMonth===12?`${currentYear+1}-01-01`:`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-01`;

  let recordUrl=`${SUPABASE_URL}/rest/v1/records?select=*&created_at=gte.${startDate}&created_at=lt.${endDate}&order=created_at.desc`;
  if(GROUP_ID)recordUrl+=`&group_id=eq.${encodeURIComponent(GROUP_ID)}`;

  let budgetUrl=`${SUPABASE_URL}/rest/v1/budgets?select=*`;
  if(GROUP_ID)budgetUrl+=`&group_id=eq.${encodeURIComponent(GROUP_ID)}`;

  try{
    const headers={'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`};
    const [rRes,bRes]=await Promise.all([
      fetch(recordUrl,{headers}),
      fetch(budgetUrl,{headers}),
    ]);
    if(!rRes.ok)throw new Error(`HTTP ${rRes.status}`);
    allRecords=await rRes.json();
    budgetData=bRes.ok?await bRes.json():[];
    renderAll();
  }catch(err){
    document.getElementById('loading').innerHTML=`<p style="color:var(--danger)">載入失敗：${err.message}</p>`;
  }
}

function renderAll(){
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
  renderStats();renderBudget();renderPieChart();renderLineChart();renderMembers();renderTable(activeFilter);
}

function renderStats(){
  const filtered=filterByCurrency(allRecords);
  const expenses=filtered.filter(r=>r.type!=='income');
  const incomes=filtered.filter(r=>r.type==='income');
  const totalExpenseTWD=expenses.reduce((s,r)=>s+toTWD(r.amount,r.currency||'JPY'),0);
  const totalIncomeTWD=incomes.reduce((s,r)=>s+toTWD(r.amount,r.currency||'JPY'),0);
  const balanceTWD=totalIncomeTWD-totalExpenseTWD;
  const avgTWD=expenses.length?totalExpenseTWD/expenses.length:0;

  document.getElementById('stat-expense').textContent=`NT$${Math.round(totalExpenseTWD).toLocaleString()}`;
  document.getElementById('stat-expense-sub').textContent=expenses.length?`≈ ¥${Math.round(totalExpenseTWD/jpyRate).toLocaleString()}`:'';
  document.getElementById('stat-income').textContent=`+NT$${Math.round(totalIncomeTWD).toLocaleString()}`;
  document.getElementById('stat-income-sub').textContent=incomes.length?`≈ ¥${Math.round(totalIncomeTWD/jpyRate).toLocaleString()}`:'';
  const balEl=document.getElementById('stat-balance');
  balEl.textContent=`${balanceTWD>=0?'+':''}NT$${Math.round(balanceTWD).toLocaleString()}`;
  balEl.className='stat-value '+(balanceTWD>=0?'income':'danger');
  document.getElementById('stat-balance-sub').textContent=filtered.length?`≈ ¥${Math.round(Math.abs(balanceTWD)/jpyRate).toLocaleString()}`:'';
  document.getElementById('stat-count').textContent=filtered.length;
  document.getElementById('stat-avg').textContent=`NT$${Math.round(avgTWD).toLocaleString()}`;
  document.getElementById('stat-avg-sub').textContent=expenses.length?`≈ ¥${Math.round(avgTWD/jpyRate).toLocaleString()}`:'';
}

function renderBudget(){
  const el=document.getElementById('budget-content');
  if(!budgetData||!budgetData.length){
    el.innerHTML=`<div class="no-budget">尚未設定預算。在 LINE 群組輸入「/預算 餐飲 30000」來設定。</div>`;
    return;
  }

  // 計算本月各類別使用量（JPY）
  const now=new Date();
  const isCurrentMonth=currentYear===now.getFullYear()&&currentMonth===now.getMonth()+1;
  const usage={};
  for(const r of allRecords.filter(r=>r.type!=='income')){
    const amtJPY=toJPY(r.amount,r.currency||'JPY');
    usage[r.category]=(usage[r.category]||0)+amtJPY;
  }

  const items=budgetData.map(b=>{
    const budgetJPY=toJPY(b.amount,b.currency||'JPY');
    const usedJPY=usage[b.category]||0;
    const pct=Math.min(Math.round(usedJPY/budgetJPY*100),999);
    const displayPct=Math.min(pct,100);
    const barClass=pct>=100?'over':pct>=80?'warn':'ok';
    const statusClass=pct>=100?'over':pct>=80?'warn':'ok';
    const statusText=pct>=100?`🚨 超出 ¥${Math.round(usedJPY-budgetJPY).toLocaleString()}`:pct>=80?`⚠️ 剩餘 ¥${Math.round(budgetJPY-usedJPY).toLocaleString()}`:`✅ 剩餘 ¥${Math.round(budgetJPY-usedJPY).toLocaleString()}`;
    const emoji=CAT_EMOJI[b.category]||'📦';
    const sym=b.currency==='TWD'?'NT$':'¥';

    return`<div class="budget-item">
      <div class="budget-item-header">
        <div class="budget-cat">${emoji} ${b.category}</div>
        <div class="budget-pct" style="color:${pct>=100?'var(--danger)':pct>=80?'var(--warn)':'var(--success)'}">${pct}%</div>
      </div>
      <div class="budget-bar-wrap">
        <div class="budget-bar ${barClass}" style="width:${displayPct}%"></div>
      </div>
      <div class="budget-amounts">
        <span class="used">¥${Math.round(usedJPY).toLocaleString()}</span>
        <span class="total">/ ${sym}${Number(b.amount).toLocaleString()}</span>
      </div>
      <div class="budget-status ${statusClass}">${statusText}</div>
    </div>`;
  }).join('');

  el.innerHTML=`<div class="budget-grid">${items}</div>`;
}

function renderPieChart(){
  const filtered=filterByCurrency(allRecords).filter(r=>r.type!=='income');
  const byCategory={};
  for(const r of filtered){
    const amtTWD=toTWD(r.amount,r.currency||'JPY');
    byCategory[r.category]=(byCategory[r.category]||0)+amtTWD;
  }
  const labels=Object.keys(byCategory);
  const data=labels.map(l=>Math.round(byCategory[l]));
  const colors=labels.map(l=>CAT_COLORS[l]||'#a0a0b0');
  if(charts.pie)charts.pie.destroy();
  if(!labels.length)return;
  charts.pie=new Chart(document.getElementById('chart-pie').getContext('2d'),{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:8}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{
      legend:{position:'right',labels:{color:'#7a7a8a',font:{size:12},padding:12,boxWidth:12}},
      tooltip:{callbacks:{label:ctx=>` NT$${ctx.raw.toLocaleString()} (${Math.round(ctx.raw/ctx.dataset.data.reduce((a,b)=>a+b,0)*100)}%)`}}
    },cutout:'65%'}
  });
}

function renderLineChart(){
  const daysInMonth=new Date(currentYear,currentMonth,0).getDate();
  const expByDay=Array(daysInMonth).fill(0);
  const incByDay=Array(daysInMonth).fill(0);
  for(const r of filterByCurrency(allRecords)){
    const day=new Date(r.created_at).getDate()-1;
    const amtTWD=toTWD(r.amount,r.currency||'JPY');
    if(day>=0&&day<daysInMonth){
      if(r.type==='income')incByDay[day]+=amtTWD;
      else expByDay[day]+=amtTWD;
    }
  }
  const labels=Array.from({length:daysInMonth},(_,i)=>`${i+1}日`);
  if(charts.line)charts.line.destroy();
  charts.line=new Chart(document.getElementById('chart-line').getContext('2d'),{
    type:'bar',
    data:{labels,datasets:[
      {label:'支出(TWD)',data:expByDay.map(v=>Math.round(v)),backgroundColor:'rgba(255,107,107,0.5)',borderColor:'rgba(255,107,107,0.9)',borderWidth:1,borderRadius:4},
      {label:'收入(TWD)',data:incByDay.map(v=>Math.round(v)),backgroundColor:'rgba(39,174,96,0.5)',borderColor:'rgba(39,174,96,0.9)',borderWidth:1,borderRadius:4},
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{
      legend:{labels:{color:'#7a7a8a',font:{size:11}}},
      tooltip:{callbacks:{label:ctx=>[` NT$${ctx.raw.toLocaleString()}`,` ≈ ¥${Math.round(ctx.raw/jpyRate).toLocaleString()}`]}}
    },scales:{
      x:{ticks:{color:'#7a7a8a',font:{size:10},maxTicksLimit:10},grid:{display:false}},
      y:{ticks:{color:'#7a7a8a',font:{size:10},callback:v=>`NT$${v.toLocaleString()}`},grid:{color:'#2e2e38'}}
    }}
  });
}

function renderMembers(){
  const byUser={};
  for(const r of filterByCurrency(allRecords).filter(r=>r.type!=='income')){
    const name=r.user_name||r.user_id;
    byUser[name]=(byUser[name]||0)+toTWD(r.amount,r.currency||'JPY');
  }
  const sorted=Object.entries(byUser).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?.[1]||1;
  document.getElementById('member-list').innerHTML=sorted.map(([name,amtTWD])=>{
    const pct=Math.round(amtTWD/max*100);
    return`<div class="member-row">
      <div class="member-avatar">${name.charAt(name.length-1)}</div>
      <div class="member-name">${name}</div>
      <div class="member-bar-wrap"><div class="member-bar" style="width:${pct}%"></div></div>
      <div class="member-amount">NT$${Math.round(amtTWD).toLocaleString()}</div>
      <div class="member-sub">≈ ¥${Math.round(amtTWD/jpyRate).toLocaleString()}</div>
    </div>`;
  }).join('')||'<div class="empty">無資料</div>';
}

function filterCategory(cat){
  activeFilter=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    const txt=b.textContent.replace(/[🍜🚌🏨🛒🎬🧴📦💰]/g,'').trim();
    b.classList.toggle('active',txt===cat);
  });
  renderTable(cat);
}

function renderTable(catFilter){
  let filtered=filterByCurrency(allRecords);
  if(catFilter==='收入')filtered=filtered.filter(r=>r.type==='income');
  else if(catFilter!=='全部')filtered=filtered.filter(r=>r.category===catFilter&&r.type!=='income');
  if(!filtered.length){document.getElementById('records-table').innerHTML='<div class="empty">無紀錄</div>';return;}
  const rows=filtered.map(r=>{
    const date=new Date(r.created_at);
    const dateStr=`${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    const isIncome=r.type==='income';
    const currency=r.currency||'JPY';
    const color=CAT_COLORS[r.category]||'#a0a0b0';
    const emoji=CAT_EMOJI[r.category]||'📦';
    const currClass=currency==='TWD'?'twd':'jpy';
    return`<tr class="${isIncome?'income-row':''}">
      <td class="date-cell">${dateStr}</td>
      <td>${r.user_name||'—'}</td>
      <td>${emoji} ${r.item}<span class="curr-badge ${currClass}">${currency}</span></td>
      <td><span class="cat-badge" style="background:${color}22;color:${color}">${r.category}</span></td>
      <td>
        <div class="amount-main ${isIncome?'income':'expense'}">${isIncome?'+':''}${fmtMain(r.amount,currency)}</div>
        <div class="amount-sub">${isIncome?'+':''}${fmtSub(r.amount,currency)}</div>
      </td>
      <td><span class="type-badge ${isIncome?'income':'expense'}">${isIncome?'收入':'支出'}</span></td>
      <td style="color:var(--muted);font-size:0.8rem">${r.note||''}</td>
    </tr>`;
  }).join('');
  document.getElementById('records-table').innerHTML=`<table><thead><tr><th>時間</th><th>成員</th><th>品項</th><th>類別</th><th>金額</th><th>類型</th><th>備註</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function exportCSV(){
  if(!allRecords.length)return alert('沒有資料可以匯出');
  const header=['時間','成員','品項','類別','類型','幣別','原始金額','換算TWD','換算JPY','備註'];
  const rows=allRecords.map(r=>{
    const currency=r.currency||'JPY';
    const amtTWD=Math.round(toTWD(r.amount,currency));
    const amtJPY=Math.round(toJPY(r.amount,currency));
    return[new Date(r.created_at).toLocaleString('zh-TW'),r.user_name||'',r.item,r.category,r.type==='income'?'收入':'支出',currency,r.amount,amtTWD,amtJPY,r.note||''];
  });
  const csv=[header,...rows].map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`記帳_${currentYear}${String(currentMonth).padStart(2,'0')}.csv`;a.click();
  URL.revokeObjectURL(url);
}
